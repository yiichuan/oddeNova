name: Sync Sample Index

on:
  schedule:
    # 每周一 UTC 02:00 运行
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  sync:
    name: Check and sync sample index JSONs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check upstream for changes
        id: check
        run: |
          node scripts/check-sample-index.mjs --fix || true
          if git diff --quiet public/sample-index/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --name-only public/sample-index/
          fi

      - name: Open PR if files changed
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/sync-sample-index-$(date +%Y%m)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/sample-index/
          git commit -m "chore: sync sample index JSONs with upstream"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: sync sample index JSONs with upstream" \
            --body "$(cat <<'EOF'
          Automated weekly sync of bundled sample index files in \`public/sample-index/\`.

          These JSON files map sound names to remote WAV URLs. Keeping them current ensures new upstream drum machines, samples, or aliases are available without a code change.

          **Changed files:**
          $(git diff origin/main --name-only public/sample-index/)

          > Generated by the [Sync Sample Index](${{ github.server_url }}/${{ github.repository }}/actions/workflows/sync-sample-index.yml) workflow.
          EOF
          )" \
            --base main \
            --head "$BRANCH"
