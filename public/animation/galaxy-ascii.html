                // cell is never claimed by a tier that won't be painted. Hashed against
                // a seed rather than rolled per frame, so a hit lights a stable set of
                // cells for its whole decay instead of crawling.
                const burstChance = burstEnergy > 0.02 ? burstEnergy * BURST_CELL_RATE : 0;
                buildRingLut();
                // Size up only the leading edge, measured against the strongest ring in
                // flight, so a soft kick still shows a wavefront instead of nothing at
                // all — just a narrower and dimmer one.
                const ringAccentFloor = Math.max(0.08, ringPeak * 0.55);

                for (let cellIndex = 0; cellIndex < densityBuffer.length; cellIndex += 1) {
                    const density = densityBuffer[cellIndex];
                    glyphBuffer[cellIndex] = 0;
                    opacityBuffer[cellIndex] = 0;
                    accentBuffer[cellIndex] = ACCENT_NONE;
                    meteorBuffer[cellIndex] = 0;
                    if (density <= 0) continue;

                    const averageRadius = radiusBuffer[cellIndex] / density;
                    const peripheralProgress = clamp(
                        (averageRadius - 24) / (OUTER_TURN_START + OUTER_TURN_SPAN - 24),
                        0,
                        1
                    );
                    const minimumPeripheralDensity = Math.pow(peripheralProgress, 1.35) * 0.04;
                    if (density < minimumPeripheralDensity) continue;

                    // Radial brightness ramp: heavily suppress the crowded inner disk and
                    // boost the sparse outer disk, so the arms read dark at the hub and
                    // bright at the rim instead of the other way round.
                    const radialExposure = lerp(
                        RADIAL_EXPOSURE_INNER,
                        RADIAL_EXPOSURE_OUTER,
                        Math.pow(clamp(averageRadius / RADIAL_EXPOSURE_SPAN, 0, 1), 1.1)
                    );
                    // The kick's shockwave rides on top of the static radial ramp: the
                    // front pushes whatever it crosses several glyphs up the ASCII
                    // scale, so the pulse is visible as a band of denser characters
                    // travelling out along the arms.
                    const ringBoost = ringBoostAt(averageRadius);
                    // Held notes light the band of the disk that matches their register,
                    // so which part of the galaxy is glowing says which register is
                    // sounding: a cello drone in the core, a high violin line at the rim.
                    const sustainBoost = sustainBoostAt(averageRadius);
                    const brightness = 1 - Math.exp(
                        -density * exposure * radialExposure
                            * (1 + sustainBoost * SUSTAIN_RADIAL_LIFT)
                            * (1 + ringBoost * RING_GLYPH_LIFT)
                    );
                    let glyphIndex = Math.floor(brightness * rampMax);
                    // Ambient twinkle, independent of the music. Two steps, not one:
                    // on the longer ramp a single step is half the brightness jump it
                    // used to be, and the twinkle stops registering as one.
                    if (hash01(cellIndex + tick * 131) > 0.82) glyphIndex += 2;
                    const resolvedGlyphIndex = clamp(glyphIndex, 2, rampMax);
                    const isPeripheralDot = averageRadius > 24
                        && resolvedGlyphIndex <= peripheralDotMaxGlyph;
                    const peripheralDotCull = peripheralProgress * 0.15;
                    if (isPeripheralDot && hash01(cellIndex * 31 + 17) < peripheralDotCull) continue;
                    glyphBuffer[cellIndex] = resolvedGlyphIndex;

                    // ── Accent tiers, highest wins the cell ─────────────────────
                    // Both accents are biased outward. Picking uniformly concentrates
                    // them in the inner disk, which holds most of the bright, densely
                    // packed cells, and the rim ends up bare; this tilts the odds far
                    // enough that the outer arms carry their share.
                    const radialProgress = clamp(averageRadius / 34, 0, 1);
                    const radialSpread = 0.25 + 2.2 * radialProgress;
                    // Arm ridges, widening toward the rim — see ARM_RIDGE_BAND_*.
                    const isArmRidge = resolvedGlyphIndex >= rampMax + 1 - Math.round(
                        lerp(ARM_RIDGE_BAND_INNER, ARM_RIDGE_BAND_OUTER, radialProgress) * usableRampSpan
                    );
                    if (isArmRidge && burstChance > 0
                        && hash01(cellIndex * 29 + accentSeed) < burstChance * radialSpread
                        && canAccent(cellIndex)) {
                        accentBuffer[cellIndex] = ACCENT_BURST;
                    } else if (ringBoost > ringAccentFloor && canAccent(cellIndex)) {
                        accentBuffer[cellIndex] = ACCENT_RING;
                    }
                    const opacityContrast = Math.pow(brightness, 0.9);
                    const radialOpacityProgress = clamp(
                        averageRadius / (OUTER_TURN_START + OUTER_TURN_SPAN),
                        0,
                        1
                    );
                    // Both the floor and the ceiling of the opacity range rise with radius,
                    // so even a saturated inner cell stays dimmer than an outer one.
                    const armGapOpacity = lerp(0.12, 0.42, radialOpacityProgress);
                    const acceleratedArmProgress = Math.pow(radialOpacityProgress, 1.4);
                    const armTargetOpacity = lerp(0.3, 1, acceleratedArmProgress);
                    let opacity = clamp(
                        lerp(armGapOpacity, armTargetOpacity, opacityContrast),
                        armGapOpacity,
                        opacityLevels.at(-1)
                    );
                    // That floor pins every faint cell to one value, so the wash
                    // between the arms came out flat and met the arm at a step. Fade
                    // the sparsest cells out of the floor instead, on density rather
                    // than on brightness — density is what actually thins away from a
                    // ridge, while brightness has already been through the radial
                    // exposure ramp and would carry that gradient in here a second
                    // time. Smoothstep so the fade has no edge of its own.
                    const sparseFade = clamp(density / SPARSE_FADE_DENSITY, 0, 1);
                    opacity *= sparseFade * sparseFade * (3 - 2 * sparseFade);
                    const centerRandom = hash01(cellIndex * 73 + 41);
                    if (averageRadius < 3.5 && centerRandom > 0.58) {
                        const centerFalloff = 1 - clamp(averageRadius / 3.5, 0, 1);
                        const randomReduction = lerp(
                            0.08,
                            0.5,
                            hash01(cellIndex * 17 + 3)
                        );
                        opacity *= 1 - randomReduction * centerFalloff;
                    }
                    if (isPeripheralDot) {
                        opacity *= lerp(1, 0.55, peripheralProgress);
                    }
                    // Opacity lift belongs to the shockwave front alone.
                    if (ringBoost > 0) {
                        opacity = clamp(opacity * (1 + ringBoost * RING_OPACITY_LIFT), 0, 1);
                    }
                    let closestOpacityIndex = 0;
                    let closestOpacityDistance = Infinity;
                    for (let index = 0; index < opacityLevels.length; index += 1) {
                        const distance = Math.abs(opacity - opacityLevels[index]);
                        if (distance >= closestOpacityDistance) continue;
                        closestOpacityDistance = distance;
                        closestOpacityIndex = index;
                    }
                    opacityBuffer[cellIndex] = closestOpacityIndex + 1;
                }

                // Last, so a streak crossing a ring or a burst stays whole: the meteor
                // is the only accent that moves, and a hole punched in it breaks the
                // line the eye is following.
                markMeteors();

                for (let opacityIndex = 0; opacityIndex < opacityLevels.length; opacityIndex += 1) {
                    context.fillStyle = `rgba(194, 197, 194, ${opacityLevels[opacityIndex]})`;
                    for (let cellIndex = 0; cellIndex < glyphBuffer.length; cellIndex += 1) {
                        const glyphIndex = glyphBuffer[cellIndex];
                        if (glyphIndex === 0 || opacityBuffer[cellIndex] !== opacityIndex + 1) continue;
                        // Accented cells are redrawn at size below; painting the base
                        // glyph too would just leave a smaller ghost underneath.
                        if (accentBuffer[cellIndex] !== ACCENT_NONE) continue;
                        const row = Math.floor(cellIndex / gridColumns);
                        context.fillText(
                            ASCII_RAMP[glyphIndex],
                            (cellIndex % gridColumns) * cellWidth,
                            row * cellHeight,
                            cellWidth
                        );
                    }
                }

                drawAccents();
            }

            /**
             * Repaints the accented cells. Each tier is one pass, so its font and
             * colour are set once, and each tier changes a different property — that
             * separation is what keeps the three voices from looking alike:
             *
             *   ring     size + colour — the wavefront, one size up, pale
             *   burst    size + colour — oversized and warm #CD5633, the only colour
             *                            on screen, grown out of the arm ridges
             *   meteor   motion        — base size, cool blue-white, a diagonal trail
             *                            travelling across the frame; it is the only
             *                            accent that moves, which is what tells it
             *                            apart from the two static tiers
             */
            function drawAccents() {
                // Painted over empty space as readily as over stars: a streak that
                // broke wherever the galaxy is thin would stop reading as one object.
                for (let index = 0; index < meteorCells.length; index += 1) {
                    const cellIndex = meteorCells[index];
                    if (accentBuffer[cellIndex] !== ACCENT_METEOR) continue;
                    const intensity = meteorBuffer[cellIndex];
                    const level = clamp(Math.ceil(intensity * METEOR_LEVELS) - 1, 0, METEOR_LEVELS - 1);
                    context.fillStyle = METEOR_COLORS[level];
                    const row = Math.floor(cellIndex / gridColumns);
                    context.fillText(
                        ASCII_RAMP[clamp(
                            Math.round(2 + intensity * (ASCII_RAMP.length - 3)),
                            2,
                            ASCII_RAMP.length - 1
                        )],
                        (cellIndex % gridColumns) * cellWidth,
                        row * cellHeight,
                        cellWidth
                    );
                }

                if (!ringLutActive && burstEnergy <= 0.02) return;

                context.textAlign = 'center';
                context.textBaseline = 'middle';

                for (let tier = ACCENT_RING; tier <= ACCENT_BURST; tier += 1) {
                    const isRing = tier === ACCENT_RING;
                    if (isRing ? !ringLutActive : burstEnergy <= 0.02) continue;
                    const scale = isRing ? 1.4 + ringPeak * 0.6 : 2.1 + burstEnergy * 0.9;
                    context.font = `700 ${fontSize * scale}px "SFMono-Regular", "Cascadia Mono", "Noto Sans Mono", monospace`;
                    context.fillStyle = isRing
                        ? `rgba(200, 208, 202, ${lerp(RING_ACCENT_ALPHA_MIN, RING_ACCENT_ALPHA_MAX, clamp(ringPeak, 0, 1))})`
                        : `rgba(205, 86, 51, ${lerp(0.6, 1, burstEnergy)})`;

                    for (let cellIndex = 0; cellIndex < accentBuffer.length; cellIndex += 1) {
                        if (accentBuffer[cellIndex] !== tier) continue;
                        const glyphIndex = glyphBuffer[cellIndex];
                        if (glyphIndex === 0) continue;
                        const row = Math.floor(cellIndex / gridColumns);
                        // The wavefront keeps each cell's own glyph so it reads as the
                        // galaxy swelling; the burst swaps in heavy glyphs so it reads
                        // as something struck onto it.
                        const glyph = isRing
                            ? ASCII_RAMP[glyphIndex]
                            : BURST_GLYPHS[
                                Math.floor(hash01(cellIndex * 13 + accentSeed) * BURST_GLYPHS.length)
                                    % BURST_GLYPHS.length
                            ];
                        context.fillText(
                            glyph,
                            (cellIndex % gridColumns + 0.5) * cellWidth,
                            (row + 0.5) * cellHeight
                        );
                    }
                }

                context.textAlign = 'left';
                context.textBaseline = 'top';
            }

            function animate(timestamp) {
                requestAnimationFrame(animate);
                // Collapsed to nothing by the host layout. The loop has to stay
                // alive — the star field is built once from unseeded randomness,
                // so tearing the document down and back up would return a
                // different galaxy — but the projection is the expensive half of
                // the frame and there is nowhere to put it. resizePending is left
                // set, so the first frame after reappearing re-measures.
                if (window.innerWidth === 0 || window.innerHeight === 0) return;
                if (resizePending) {
                    resizePending = false;
                    resize();
                    // The resize blanked the canvas; bypass the frame throttle so this
                    // same frame repaints it.
                    lastFrameTime = -Infinity;
                }
                const time = simTime !== null ? simTime : timestamp * 0.001;
                // Step the audio from the same clock that drives the visuals, so an
                // offline video render flies meteors at the rendered rate, not wall time.
                const delta = lastVisualTime === null
                    ? FRAME_INTERVAL / 1000
                    : clamp(time - lastVisualTime, 0, 0.25);
                lastVisualTime = time;

                // Listen every frame, draw at 30fps. Sampling the spectrum only on
                // drawn frames costs half the temporal resolution of the beat
                // detection, and loses more as a heavier track drags the frame rate
                // down — the visuals slide off the music exactly when it gets busy.
                if (!audioConnected) tryConnectAudio();
                updateAudio(delta);
                updateGlitch(delta);

                if (simTime === null && timestamp - lastFrameTime < FRAME_INTERVAL) return;
                lastFrameTime = timestamp;

                const visualTime = prefersReducedMotion ? 0 : time;
                projectGalaxy(visualTime);
                drawAscii(visualTime);
            }

            function lerp(from, to, amount) {
                return from + (to - from) * amount;
            }

            // Exponential follower with a time constant in seconds, so its behaviour
            // doesn't change when the frame rate does.
            function follow(from, to, timeConstant, delta) {
                return lerp(from, to, 1 - Math.exp(-delta / timeConstant));
            }

            // Roughly Gaussian in [-1.35, 1.35] (std ~0.45): gives scattered structures a
            // soft density falloff instead of a uniformly filled band.
            function bellRandom() {
                return (Math.random() + Math.random() + Math.random() - 1.5) * 0.9;
            }

            function clamp(value, minimum, maximum) {
                return Math.max(minimum, Math.min(maximum, value));
            }

            function hash01(value) {
                let hash = value | 0;
                hash = Math.imul(hash ^ (hash >>> 16), 0x45d9f3b);
                hash = Math.imul(hash ^ (hash >>> 16), 0x45d9f3b);
                hash ^= hash >>> 16;
                return (hash >>> 0) / 4294967295;
            }
        })();
    </script>
</body>
